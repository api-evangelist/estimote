aid: estimote
name: Estimote
description: Estimote is a proximity and indoor-location company founded in 2012 that designs Bluetooth
  Low Energy, Ultra-Wideband (UWB) and LTE-M/NB-IoT beacons together with the Estimote Cloud platform
  for managing them at fleet scale. The Estimote Cloud REST API lets developers list and configure registered
  devices, attach contextual key/value data (Attachments) to individual beacons, and consume events reported
  by LTE beacons, authenticated with an App ID and App Token over HTTP Basic or, in private beta, OAuth
  2.0. Native SDKs for iOS, Android, React Native and UWB deliver on-device proximity, indoor positioning,
  secure iBeacon/Eddystone broadcasting and beacon fleet management. Estimote is backed by a16z and Homebrew.
